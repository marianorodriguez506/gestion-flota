<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020b14">
  <title>Sin conexión - Gestion Flota</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020b14;
      --panel: #071421;
      --line: rgba(148, 163, 184, .28);
      --accent: #facc15;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(250, 204, 21, .16), transparent 17rem),
        linear-gradient(160deg, #020617 0%, #03111f 52%, #020617 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }

    main {
      width: min(100%, 420px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(8, 24, 40, .96), rgba(4, 14, 25, .98));
      padding: 22px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, .32);
    }

    strong,
    span {
      display: block;
    }

    strong {
      font-size: 26px;
      line-height: 1.1;
    }

    span {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.4;
    }

    a {
      min-height: 46px;
      display: grid;
      place-items: center;
      margin-top: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #06111f;
      font-weight: 950;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <strong>Sin conexión</strong>
    <span>La app está instalada, pero para actualizar reportes y sincronizar datos necesitás señal.</span>
    <a href="/">Volver a intentar</a>
  </main>
</body>
</html>
